name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Nothing here is packed into an archive of its own. GitHub always zips what it
# is handed to an Actions artifact, so building a zip or a tarball first meant
# downloading a zip that contained another archive. Every job now uploads plain
# files: one unavoidable zip around them from GitHub, and release assets, which
# are attached exactly as given, are not archived at all.

jobs:
  windows:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # 24, not 20: the tests in tests/*.mjs load the UI's TypeScript straight from webui/src,
          # which Node does on its own from 22.18 (20 stops at the first .ts import).
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build web UI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run test suite
        run: python tests/run_all.py

      # Two ways to ship the same app. The folder build starts instantly and is
      # treated far better by antivirus, and it is what the installer wraps. The
      # portable one is a single exe with nothing beside it, at the cost of
      # unpacking itself on every launch, so it takes a few seconds to appear.
      # Both specs share packaging/specparts.py so they cannot drift apart.
      # The tag is the single source of truth for what version this is. It gets
      # written into app/_build.py, which app/version.py reads, so the About
      # panel and the update check report the release rather than whatever was
      # last hardcoded. Untagged builds are honestly labelled as dev.
      - name: Stamp the version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+') { $version = "0.0.0-dev" }
          $lines = @(
            '# Generated by the build. Not in git: a source checkout falls back to',
            '# the development version in app/version.py.',
            "VERSION = `"$version`""
          )
          Set-Content -Path app/_build.py -Encoding utf8 -Value $lines
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "stamped $version"

      - name: Build exe (folder)
        run: pyinstaller packaging/selfbot.spec --noconfirm

      - name: Build exe (single file)
        run: pyinstaller packaging/selfbot-onefile.spec --noconfirm --distpath dist/onefile --workpath build/onefile

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          # Same value the binary was stamped with, so the installer and the
          # app can never disagree about what this build is.
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging\installer.iss
          Copy-Item dist/onefile/LLMSelfbot.exe dist/LLMSelfbot-portable.exe
          # Printed into the build log rather than shipped as a file: a
          # checksum published beside the binary it describes, by the same job
          # that built it, proves nothing an attacker could not also rewrite,
          # and it meant every release carried files nobody downloads.
          Get-FileHash dist/LLMSelfbotSetup.exe, dist/LLMSelfbot-portable.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LLMSelfbot-windows-x64
          path: |
            dist/LLMSelfbotSetup.exe
            dist/LLMSelfbot-portable.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LLMSelfbotSetup.exe
            dist/LLMSelfbot-portable.exe

  # Linux (x86_64 and ARM64, a Raspberry Pi say) and macOS build the same
  # headless binary: no native window, it serves the control panel and you open
  # that in a browser. One matrix instead of three copies of the same twelve
  # steps. The file names are the ones app/utils/device.py looks for when the
  # app updates itself, so the two must not drift apart.
  headless:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            asset: LLMSelfbot-linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            asset: LLMSelfbot-linux-aarch64
          - os: macos-latest
            name: macos-arm64
            asset: LLMSelfbot-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build web UI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run test suite
        run: python tests/run_all.py

      # See the Windows job: the tag is what decides the version, not a
      # constant someone has to remember to edit.
      - name: Stamp the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*.[0-9]*) ;;
            *) version="0.0.0-dev" ;;
          esac
          {
            echo "# Generated by the build. Not in git: a source checkout falls back to the"
            echo "# development version in app/version.py."
            echo "VERSION = \"$version\""
          } > app/_build.py
          echo "stamped $version"

      # A single binary, so there is no folder to archive and nothing to unzip:
      # download it, chmod +x, run it.
      - name: Build binary
        run: pyinstaller packaging/selfbot-headless-onefile.spec --noconfirm

      - name: Name and hash it
        run: |
          mv dist/LLMSelfbot "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          "./dist/${{ matrix.asset }}" --help > /dev/null
          echo "it runs"
          # Into the log, not into the release. See the Windows job.
          if command -v sha256sum > /dev/null; then
            (cd dist && sha256sum "${{ matrix.asset }}")
          else
            (cd dist && shasum -a 256 "${{ matrix.asset }}")
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LLMSelfbot-${{ matrix.name }}
          path: dist/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}

  # The phone apps (mobile/): the bot and its panel running on the phone
  # itself, built with BeeWare's Briefcase around the same app/. mobile/stage.py
  # lays the project out and makes the few packages nobody publishes for
  # phones; see it for why each is needed.
  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 3.13: curl_cffi, which Discord's library needs, publishes its Android
      # build for 3.13, and Briefcase builds for the Python it runs on.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build web UI
        working-directory: webui
        run: |
          npm ci
          npm run build

      # The tag decides the version, as for the desktop builds.
      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*.[0-9]*) ;;
            *) version="0.0.0-dev" ;;
          esac
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Lay out the app
        run: |
          python -m pip install --upgrade pip "briefcase==0.4.5" pillow
          python mobile/stage.py --version "$APP_VERSION" --android

      # The runner's own Android SDK, licences already accepted.
      - name: Build the APK
        working-directory: build/mobile
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          briefcase create android --no-input
          briefcase build android --no-input
          briefcase package android --no-input -p apk

      # Android only installs a new version over the old one if both carry the
      # same signature, so releases should be signed with one key kept as a
      # secret (README, "Signing the Android app"). Without it the build still
      # comes out, signed with a key made for this build alone.
      - name: Sign it
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          tools=$(ls -d "$sdk"/build-tools/* | sort -V | tail -1)
          unsigned=$(ls build/mobile/dist/*.apk | head -1)
          "$tools/zipalign" -f -p 4 "$unsigned" aligned.apk
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.keystore
            "$tools/apksigner" sign --ks release.keystore --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "${KEY_ALIAS:-llmselfbot}" --out LLMSelfbot-android.apk aligned.apk
            rm release.keystore
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with a key made for this build: installing a later one will need this one removed first. See the README."
            keytool -genkeypair -keystore throwaway.keystore -storepass android -keypass android \
              -alias llmselfbot -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LLMSelfbot"
            "$tools/apksigner" sign --ks throwaway.keystore --ks-pass pass:android \
              --ks-key-alias llmselfbot --out LLMSelfbot-android.apk aligned.apk
          fi
          "$tools/apksigner" verify LLMSelfbot-android.apk
          # Into the log, not into the release. See the Windows job.
          sha256sum LLMSelfbot-android.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LLMSelfbot-android
          path: LLMSelfbot-android.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LLMSelfbot-android.apk

  # The iPhone app, unsigned: it is installed with AltStore or SideStore,
  # which sign it for the phone with the person's own Apple ID. Built on a
  # Mac because only Xcode builds for iOS.
  ios:
    name: ios
    runs-on: macos-latest
    # The newest of the builds, and one no computer here could try first: a
    # failure in it is shown, but does not hold back the rest of the release.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build web UI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*.[0-9]*) ;;
            *) version="0.0.0-dev" ;;
          esac
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Lay out the app
        run: |
          python -m pip install --upgrade pip "briefcase==0.4.5" pillow
          python mobile/stage.py --version "$APP_VERSION" --ios

      - name: Make the Xcode project
        working-directory: build/mobile
        run: briefcase create iOS --no-input

      # For a phone, not the simulator, and not signed: there is no Apple
      # certificate here. Python's own libraries are still signed as they go
      # in (its build script always signs them), so they are given "-", an
      # ad-hoc signature that needs no certificate; the installer re-signs
      # the whole app for the phone anyway.
      - name: Build for iPhone
        run: |
          xcodebuild \
            -project "build/mobile/build/llmselfbot/ios/xcode/LLMSelfbot.xcodeproj" \
            -scheme LLMSelfbot -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="-" \
            build

      # An IPA is the app in a folder called Payload, zipped.
      - name: Make the IPA
        run: |
          app=$(find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -1)
          test -n "$app"
          mkdir -p ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../LLMSelfbot-ios.ipa Payload)
          # AltStore and SideStore keep an app up to date from a source: this
          # one lists this release's IPA, and the README says how to add it.
          python mobile/altstore.py --version "$APP_VERSION" --ipa LLMSelfbot-ios.ipa \
            --tag "$GITHUB_REF_NAME" > altstore.json
          shasum -a 256 LLMSelfbot-ios.ipa

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LLMSelfbot-ios
          path: |
            LLMSelfbot-ios.ipa
            altstore.json

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LLMSelfbot-ios.ipa
            altstore.json
