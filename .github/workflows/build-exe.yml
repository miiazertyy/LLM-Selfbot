name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Nothing here is packed into an archive of its own. GitHub always zips what it
# is handed to an Actions artifact, so building a zip or a tarball first meant
# downloading a zip that contained another archive. Every job now uploads plain
# files: one unavoidable zip around them from GitHub, and release assets, which
# are attached exactly as given, are not archived at all.

jobs:
  windows:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build web UI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run test suite
        run: python tests/run_all.py

      # Two ways to ship the same app. The folder build starts instantly and is
      # treated far better by antivirus, and it is what the installer wraps. The
      # portable one is a single exe with nothing beside it, at the cost of
      # unpacking itself on every launch, so it takes a few seconds to appear.
      # Both specs share packaging/specparts.py so they cannot drift apart.
      - name: Build exe (folder)
        run: pyinstaller packaging/selfbot.spec --noconfirm

      - name: Build exe (single file)
        run: pyinstaller packaging/selfbot-onefile.spec --noconfirm --distpath dist/onefile --workpath build/onefile

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          # A tagged build names itself after the tag; anything else is a dev build.
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+') { $version = "0.0.0-dev" }
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          Copy-Item dist/onefile/LLMSelfbot.exe dist/LLMSelfbot-portable.exe
          Get-FileHash dist/LLMSelfbotSetup.exe, dist/LLMSelfbot-portable.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } > dist/SHA256SUMS-windows.txt
          Get-Content dist/SHA256SUMS-windows.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LLMSelfbot-windows-x64
          path: |
            dist/LLMSelfbotSetup.exe
            dist/LLMSelfbot-portable.exe
            dist/SHA256SUMS-windows.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LLMSelfbotSetup.exe
            dist/LLMSelfbot-portable.exe
            dist/SHA256SUMS-windows.txt

  # Linux, ARM and macOS build the same headless binary: no native window, it
  # serves the control panel and you open that in a browser. One matrix instead
  # of three copies of the same twelve steps.
  headless:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            asset: selfbot-linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            asset: selfbot-linux-aarch64
          - os: macos-latest
            name: macos-arm64
            asset: selfbot-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build web UI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run test suite
        run: python tests/run_all.py

      # A single binary, so there is no folder to archive and nothing to unzip:
      # download it, chmod +x, run it.
      - name: Build binary
        run: pyinstaller packaging/selfbot-headless-onefile.spec --noconfirm

      - name: Name and hash it
        run: |
          mv dist/selfbot "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          "./dist/${{ matrix.asset }}" --help > /dev/null
          echo "it runs"
          if command -v sha256sum > /dev/null; then
            (cd dist && sha256sum "${{ matrix.asset }}" > "SHA256SUMS-${{ matrix.name }}.txt")
          else
            (cd dist && shasum -a 256 "${{ matrix.asset }}" > "SHA256SUMS-${{ matrix.name }}.txt")
          fi
          cat "dist/SHA256SUMS-${{ matrix.name }}.txt"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LLMSelfbot-${{ matrix.name }}
          path: |
            dist/${{ matrix.asset }}
            dist/SHA256SUMS-${{ matrix.name }}.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/SHA256SUMS-${{ matrix.name }}.txt
