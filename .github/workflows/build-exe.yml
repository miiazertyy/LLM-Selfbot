name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Nothing here is packed into an archive of its own. GitHub always zips what it
# is handed to an Actions artifact, so building a zip or a tarball first meant
# downloading a zip that contained another archive. Every job now uploads plain
# files: one unavoidable zip around them from GitHub, and release assets, which
# are attached exactly as given, are not archived at all.

jobs:
  windows:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build web UI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run test suite
        run: python tests/run_all.py

      # Two ways to ship the same app. The folder build starts instantly and is
      # treated far better by antivirus, and it is what the installer wraps. The
      # portable one is a single exe with nothing beside it, at the cost of
      # unpacking itself on every launch, so it takes a few seconds to appear.
      # Both specs share packaging/specparts.py so they cannot drift apart.
      # The tag is the single source of truth for what version this is. It gets
      # written into app/_build.py, which app/version.py reads, so the About
      # panel and the update check report the release rather than whatever was
      # last hardcoded. Untagged builds are honestly labelled as dev.
      - name: Stamp the version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+') { $version = "0.0.0-dev" }
          $lines = @(
            '# Generated by the build. Not in git: a source checkout falls back to',
            '# the development version in app/version.py.',
            "VERSION = `"$version`""
          )
          Set-Content -Path app/_build.py -Encoding utf8 -Value $lines
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "stamped $version"

      - name: Build exe (folder)
        run: pyinstaller packaging/selfbot.spec --noconfirm

      - name: Build exe (single file)
        run: pyinstaller packaging/selfbot-onefile.spec --noconfirm --distpath dist/onefile --workpath build/onefile

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          # Same value the binary was stamped with, so the installer and the
          # app can never disagree about what this build is.
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging\installer.iss
          Copy-Item dist/onefile/LLMSelfbot.exe dist/LLMSelfbot-portable.exe
          # Printed into the build log rather than shipped as a file: a
          # checksum published beside the binary it describes, by the same job
          # that built it, proves nothing an attacker could not also rewrite,
          # and it meant every release carried files nobody downloads.
          Get-FileHash dist/LLMSelfbotSetup.exe, dist/LLMSelfbot-portable.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LLMSelfbot-windows-x64
          path: |
            dist/LLMSelfbotSetup.exe
            dist/LLMSelfbot-portable.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LLMSelfbotSetup.exe
            dist/LLMSelfbot-portable.exe

  # Linux, ARM and macOS build the same headless binary: no native window, it
  # serves the control panel and you open that in a browser. One matrix instead
  # of three copies of the same twelve steps.
  headless:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            asset: LLMSelfbot-linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            asset: LLMSelfbot-linux-aarch64
          - os: macos-latest
            name: macos-arm64
            asset: LLMSelfbot-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build web UI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run test suite
        run: python tests/run_all.py

      # See the Windows job: the tag is what decides the version, not a
      # constant someone has to remember to edit.
      - name: Stamp the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*.[0-9]*) ;;
            *) version="0.0.0-dev" ;;
          esac
          {
            echo "# Generated by the build. Not in git: a source checkout falls back to the"
            echo "# development version in app/version.py."
            echo "VERSION = \"$version\""
          } > app/_build.py
          echo "stamped $version"

      # A single binary, so there is no folder to archive and nothing to unzip:
      # download it, chmod +x, run it.
      - name: Build binary
        run: pyinstaller packaging/selfbot-headless-onefile.spec --noconfirm

      - name: Name and hash it
        run: |
          mv dist/LLMSelfbot "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"
          "./dist/${{ matrix.asset }}" --help > /dev/null
          echo "it runs"
          # Into the log, not into the release. See the Windows job.
          if command -v sha256sum > /dev/null; then
            (cd dist && sha256sum "${{ matrix.asset }}")
          else
            (cd dist && shasum -a 256 "${{ matrix.asset }}")
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LLMSelfbot-${{ matrix.name }}
          path: dist/${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
