name: "Community: requests"

# Community profiles, with no server: what the app sends (a request issue), what people report, and what moderators
# say in comments. The scripts are in community/scripts; the profiles live on the community-data branch, checked out
# beside them. Every run works from the issue as it is now, so a run twice does no harm. The issue's text is read by
# Python from the event file: it never goes into a shell line here.
#
# No schedule on purpose: GitHub pauses scheduled workflows in a quiet repo, and this one must always hear a request.
# The site workflow starts the sweep (for anything an event missed) every few hours instead.

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions: {}

concurrency:
  group: community-write
  queue: max

jobs:
  handle:
    # Only the community's issues: the app's own bug reports and their comments never start a run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, 'llmselfbot:') ||
        contains(github.event.issue.labels.*.name, 'profile-report'))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null &&
        startsWith(github.event.comment.body, '/') &&
        (contains(github.event.issue.body, 'llmselfbot:') ||
          contains(join(github.event.issue.labels.*.name, ' '), 'profile-')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: community

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install what it needs
        run: python -m pip install --require-hashes -r community/scripts/requirements.txt

      - name: Labels and the data branch
        run: python community/scripts/setup_repo.py --labels --branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

      - uses: actions/checkout@v7
        with:
          ref: community-data
          path: data
          fetch-depth: 0

      - name: Install ffmpeg
        # Only videos need it; a quick check of the event file decides, in Python.
        run: |
          if python community/scripts/needs_ffmpeg.py; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi

      - name: Handle it
        run: python community/scripts/moderate.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMUNITY_DATA: data
          AUTHOR_KEY: ${{ secrets.AUTHOR_KEY }}
